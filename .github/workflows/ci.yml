name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: emojipass-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repository whitespace check
        run: git diff --check

      - name: JavaScript syntax
        run: node --check script.js

      - name: Validate HTML references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          refs = re.findall(r'<(?:script[^>]+src|link[^>]+href)=["\']([^"\']+)', html, re.I)
          local = []
          for ref in refs:
              clean = ref.split("?", 1)[0]
              if clean.startswith(("http://", "https://", "//", "data:", "mailto:")):
                  continue
              local.append(clean.lstrip("/"))

          missing = [ref for ref in local if not Path(ref).exists()]
          if missing:
              raise SystemExit(f"Missing local assets: {missing}")
          print(f"Validated {len(local)} local asset references")
          PY

      - name: Security contract
        run: |
          if grep -n "Math\.random" script.js; then
            echo "Secure generator must not use Math.random()"
            exit 1
          fi
          grep -q "crypto.getRandomValues" script.js
          grep -q "navigator.clipboard" script.js
          echo "Web Crypto and clipboard contracts OK"

      - name: HTML smoke checks
        run: |
          grep -qi '<title>.*EmojiPass' index.html
          grep -q 'meta name="viewport"' index.html
          grep -q 'meta name="description"' index.html
          echo "HTML smoke checks OK"
